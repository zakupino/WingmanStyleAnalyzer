
name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WingmanStyleAnalyzer-Windows
          path: |
            build/WingmanStyleAnalyzer_artefacts/Release/VST3/**
            build/WingmanStyleAnalyzer_artefacts/Release/Standalone/**
          if-no-files-found: error
